<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Shop - Reserva tu Cita</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #f39c12;
            margin-bottom: 5px;
            font-size: 24px;
        }
        p.subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ddd;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background: #2c2c2c;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #f39c12;
            border: none;
            color: #121212;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e08e0b;
        }
        .share-container {
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        .btn-share {
            background-color: transparent;
            border: 2px solid #f39c12;
            color: #f39c12;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .btn-share:hover {
            background-color: #f39c12;
            color: #121212;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- AQUÍ PUEDES CAMBIAR EL NOMBRE DE LA BARBERÍA -->
        <h1>Barbería BARBAROS</h1>
        <p class="subtitle">Reserva tu corte con tu barbero de confianza</p>
        
        <form id="reservaForm">
            <div class="form-group">
                <label for="nombre">Tu nombre:</label>
                <input type="text" id="nombre" required placeholder="Ej. Carlos Pérez">
            </div>

            <div class="form-group">
                <label for="servicio">Selecciona el Servicio:</label>
                <select id="servicio">
                    <option value="Corte Escolar / Niños - S/ 15">Corte Escolar / Niños - S/ 15</option>
                    <option value="Corte Clásico - S/ 20">Corte Clásico - S/ 20</option>
                    <option value="Fade / Degradado - S/ 25">Fade / Degradado - S/ 25</option>
                    <option value="Corte + Barba - S/ 35">Corte + Barba - S/ 35</option>
                    <option value="Corte + Cejas - S/ 28">Corte + Cejas - S/ 28</option>
                    <option value="Diseño / Barbería Completa - S/ 45">Diseño / Barbería Completa - S/ 45</option>
                </select>
            </div>

            <div class="form-group">
                <label for="hora">Hora Disponible:</label>
                <select id="hora">
                    <option value="11:00 AM">11:00 AM</option>
                    <option value="12:00 AM">12:00 AM</option>
                    <option value="01:00 PM">01:00 PM</option>
                    <option value="02:00 PM">02:00 PM</option>
                    <option value="03:00 PM">03:00 PM</option>
                    <option value="04:00 PM">04:00 PM</option>
                    <option value="05:00 PM">05:00 PM</option>
                    <option value="06:00 PM">06:00 PM</option>
                    <option value="07:00 PM">07:00 PM</option>
                </select>
            </div>

            <button type="submit">Reservar por WhatsApp</button>
        </form>

        <div class="share-container">
            <button type="button" class="btn-share" id="btnCompartir">Compartir Aplicación 📤</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('reservaForm');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const servicio = document.getElementById('servicio').value;
            const hora = document.getElementById('hora').value;

            // NÚMERO CONFIGURADO
            const numeroWhatsApp = "51996887022"; 

            const texto = `Hola, quiero reservar una cita.%0A%0A*Cliente:* ${nombre}%0A*Servicio:* ${servicio}%0A*Hora:* ${hora}`;
            
            window.open(`https://wa.me/${numeroWhatsApp}?text=${texto}`, '_blank');
        });

        // Función para el botón de compartir
        document.getElementById('btnCompartir').addEventListener('click', async function() {
            const shareData = {
                title: 'Barbería BARBAROS',
                text: '¡Reserva tu corte de cabello fácilmente en la Barbería BARBAROS!',
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    const mensaje = encodeURIComponent("¡Reserva tu cita en Barbería BARBAROS aquí: " + window.location.href + " !");
                    window.open("https://api.whatsapp.com/send?text=" + mensaje, "_blank");
                }
            } catch (err) {
                console.log("Error al compartir: ", err);
            }
        });
    </script>

</body>
</html>
