<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Shop - Reserva tu Cita</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #f39c12;
            margin-bottom: 5px;
            font-size: 24px;
        }
        p.subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .status-badge {
            text-align: center;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .open { background-color: #27ae60; color: #fff; }
        .closed { background-color: #c0392b; color: #fff; }

        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ddd;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background: #2c2c2c;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
        }
        textarea {
            resize: none;
            height: 60px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #f39c12;
            border: none;
            color: #121212;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e08e0b;
        }
        .payment-methods {
            text-align: center;
            margin: 15px 0;
            font-size: 13px;
            color: #888;
        }
        .info-section {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
            text-align: center;
        }
        .info-section p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }
        .social-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-social, .btn-map {
            flex: 1;
            padding: 8px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .btn-social:hover, .btn-map:hover {
            background-color: #444;
        }
        .share-container {
            margin-top: 10px;
        }
        .btn-share {
            background-color: transparent;
            border: 2px solid #f39c12;
            color: #f39c12;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .btn-share:hover {
            background-color: #f39c12;
            color: #121212;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Barbería BÁRBAROS</h1>
        <p class="subtitle">Reserva tu corte con tu barbero de confianza</p>
        
        <div class="status-badge">
            <span id="estadoNegocio" class="badge">Verificando horario...</span>
        </div>

        <form id="reservaForm">
            <div class="form-group">
                <label for="nombre">Tu nombre:</label>
                <input type="text" id="nombre" required placeholder="Ej. Carlos Pérez">
            </div>

            <div class="form-group">
                <label for="barbero">Selecciona al Barbero:</label>
                <select id="barbero">
                    <option value="Cualquier Barbero / El que esté libre">Cualquier Barbero</option>
                    <option value="Barbero Principal">Barbero Principal</option>
                    <option value="Jhon (Tu Barbero)">Jhon</option>
                </select>
            </div>

            <div class="form-group">
                <label for="servicio">Selecciona el Servicio:</label>
                <select id="servicio">
                    <option value="Corte Escolar / Niños - S/ 15">Corte Escolar / Niños - S/ 15</option>
                    <option value="Corte Clásico - S/ 20">Corte Clásico - S/ 20</option>
                    <option value="Fade / Degradado - S/ 25">Fade / Degradado - S/ 25</option>
                    <option value="Corte + Barba - S/ 35">Corte + Barba - S/ 35</option>
                    <option value="Corte + Cejas - S/ 28">Corte + Cejas - S/ 28</option>
                    <option value="Diseño / Barbería Completa - S/ 45">Diseño / Barbería Completa - S/ 45</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de la Cita:</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="hora">Hora Disponible:</label>
                <select id="hora">
                    <option value="11:00 AM">11:00 AM</option>
                    <option value="12:00 PM">12:00 PM</option>
                    <option value="01:00 PM">01:00 PM</option>
                    <option value="02:00 PM">02:00 PM</option>
                    <option value="03:00 PM">03:00 PM</option>
                    <option value="04:00 PM">04:00 PM</option>
                    <option value="05:00 PM">05:00 PM</option>
                    <option value="06:00 PM">06:00 PM</option>
                    <option value="07:00 PM">07:00 PM</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nota">Observación o Detalle (Opcional):</label>
                <textarea id="nota" placeholder="Ej. Con diseño de raya a un lado..."></textarea>
            </div>

            <div class="payment-methods">
                💳 Aceptamos: Efectivo, Yape y Plin
            </div>

            <button type="submit">Reservar por WhatsApp</button>
        </form>

        <div class="info-section">
            <p>📍 Visítanos y conoce más de nosotros</p>
            <div class="social-buttons">
                <a href="https://maps.google.com" target="_blank" class="btn-map">Ver Ubicación 🗺️</a>
                <a href="https://instagram.com" target="_blank" class="btn-social">Instagram 📷</a>
            </div>

            <div class="share-container">
                <button type="button" class="btn-share" id="btnCompartir">Compartir Aplicación 📤</button>
            </div>
        </div>
    </div>

    <script>
        // Poner la fecha de hoy automáticamente en el calendario al abrir la página
        document.getElementById('fecha').valueAsDate = new Date();

        // Control automático de Abierto / Cerrado (Ej: abierto de 10am a 9pm)
        const ahora = new Date();
        const horaActual = ahora.getHours();
        const badgeEstado = document.getElementById('estadoNegocio');
        
        if (horaActual >= 10 && horaActual < 21) {
            badgeEstado.textContent = "🟢 Abierto Ahora";
            badgeEstado.className = "badge open";
        } else {
            badgeEstado.textContent = "🔴 Cerrado Ahora (Agenda para mañana)";
            badgeEstado.className = "badge closed";
        }

        const form = document.getElementById('reservaForm');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const barbero = document.getElementById('barbero').value;
            const servicio = document.getElementById('servicio').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;
            const nota = document.getElementById('nota').value;

            const numeroWhatsApp = "51996887022"; 

            let texto = `Hola, quiero reservar una cita.%0A%0A*Cliente:* ${nombre}%0A*Barbero:* ${barbero}%0A*Servicio:* ${servicio}%0A*Fecha:* ${fecha}%0A*Hora:* ${hora}`;
            
            if (nota) {
                texto += `%0A*Nota:* ${nota}`;
            }
            
            window.open(`https://wa.me/${numeroWhatsApp}?text=${texto}`, '_blank');
        });

        // Botón de compartir
        document.getElementById('btnCompartir').addEventListener('click', async function() {
            const shareData = {
                title: 'Barbería BÁRBAROS',
                text: '¡Reserva tu corte de cabello fácilmente en la Barbería BÁRBAROS!',
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    const mensaje = encodeURIComponent("¡Reserva tu cita en Barbería BÁRBAROS aquí: " + window.location.href + " !");
                    window.open("https://api.whatsapp.com/send?text=" + mensaje, "_blank");
                }
            } catch (err) {
                console.log("Error al compartir: ", err);
            }
        });
    </script>

</body>
</html>
